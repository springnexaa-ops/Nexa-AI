name: NEXA Android APK

on:
  workflow_dispatch:
    inputs:
      nexa_url:
        description: "HTTPS URL of the deployed NEXA AI web app"
        required: true
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build release APK
        env:
          NEXA_WEB_URL: ${{ inputs.nexa_url }}
        run: |
          case "$NEXA_WEB_URL" in
            https://*) ;;
            *) echo "NEXA_WEB_URL must be HTTPS"; exit 1 ;;
          esac
          gradle :app:assembleRelease -PnexaUrl="$NEXA_WEB_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-ai-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
