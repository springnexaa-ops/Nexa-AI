name: NEXA Medical Production Gate

on:
  push:
    branches: [main]
    paths-ignore:
      - "android-app/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "android-app/**"

permissions:
  contents: read

concurrency:
  group: medical-production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript + UI + Medical + Cloudflare validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production gate
        run: npm run production:gate
