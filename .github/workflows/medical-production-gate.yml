name: NEXA Medical Production Gate

on:
  push:
    branches: [main]
    paths-ignore:
      - "android-app/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "android-app/**"

permissions:
  contents: read

concurrency:
  group: medical-production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript + UI + Medical + Foundation validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Mandatory pre-main validation
        run: npm run pre-main-check

      - name: Validate foundation record tooling
        run: node scripts/validate-nexa-foundation-record.mjs --help
