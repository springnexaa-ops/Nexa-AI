name: NEXA Medical Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: medical-production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript + Audit + Cloudflare validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Medical audit tests
        run: npm run test:medical-audit

      - name: Cloudflare Wrangler dry-run
        run: npm run cf:dry-run

      - name: Production gate
        run: npm run production:gate
