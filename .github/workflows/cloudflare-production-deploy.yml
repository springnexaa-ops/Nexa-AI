name: NEXA Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexa-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, Deploy and Verify NEXA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run mandatory pre-main validation
        run: npm run pre-main-check

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc --message "NEXA production ${{ github.sha }}"

      - name: Verify production Worker
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://ai.springnexa.in"
          UI_VERSION="20261007-public-ui-v2"

          echo "Checking ${BASE_URL}/health"
          health="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 30 "${BASE_URL}/health")"
          echo "$health"
          echo "$health" | grep -Fq '"ok":true'
          echo "$health" | grep -Fq '"service":"Nexa AI"'

          echo "Checking deployed index.html"
          index="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 30 "${BASE_URL}/?nexa_deploy=${GITHUB_SHA}")"
          echo "$index" | grep -Fq "/nexa-shell.js?v=${UI_VERSION}"

          echo "Checking deployed NEXA public workspace bundle"
          shell="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 30 "${BASE_URL}/nexa-shell.js?v=${UI_VERSION}&nexa_deploy=${GITHUB_SHA}")"
          echo "$shell" | grep -Fq "nexa-public-ui"
          echo "$shell" | grep -Fq "Files & Analysis"
          echo "$shell" | grep -Fq "Trust & Safety"

          echo "NEXA production deployment verification PASSED."
