plugins { id "com.android.application" }

android {
    namespace "in.springnexa.nexaai"
    compileSdk 35

    defaultConfig {
        applicationId "in.springnexa.nexaai"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Sign the downloadable CI release with the SDK debug key for testing.
            // Production/Play Store builds should use a protected dedicated keystore.
            signingConfig signingConfigs.debug
        }
    }
}
