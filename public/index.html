<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Nexa AI by SpringNexa — an intelligent workspace for chat, research, files, images, voice and healthcare assistance.">
<meta name="theme-color" content="#071018">
<title>Nexa AI | SpringNexa</title>
<style>
html,body{margin:0;min-height:100%;background:#071018;color:#edf6ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}#nexa-loader{min-height:100vh;width:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,#12304a 0,#071018 55%,#04090e 100%)}#nexa-loader .box{padding:28px}#nexa-loader img{width:52px;height:52px;border-radius:15px;background:#fff;margin-bottom:14px}#nexa-loader b{display:block;font-size:18px}#nexa-loader span{display:block;margin-top:7px;color:#8298a9;font-size:12px}#nexa-loader i{display:block;width:24px;height:24px;border:2px solid #315064;border-top-color:#edf6ff;border-radius:50%;animation:spin .8s linear infinite;margin:18px auto 0}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="nexa-loader"><div class="box"><img src="/springnexa-logo.svg" alt="SpringNexa"><b>NEXA AI</b><span id="nexa-loader-text">Loading your secure AI workspace…</span><i></i></div></div>
<!-- Public consumer AI entry. Administrator Console is intentionally separate. -->
<script src="/app-functional.js?v=20260916-1" defer></script>
<script src="/auth-fetch.js?v=20260916-1" defer></script>
<script src="/auth-widget.js?v=20260916-1" defer></script>
<script src="/nexa-shell.js?v=20260916-2" defer></script>
<script src="/nexa-chat-bridge.js?v=20260916-1" defer></script>
<script>
(function(){
  var started=Date.now(), retried=false;
  function mountReady(){return !!document.getElementById('nexaConsumer');}
  function showFailure(message){
    if(mountReady())return;
    var t=document.getElementById('nexa-loader-text');
    if(t)t.textContent=message;
  }
  function retryShell(){
    if(mountReady()||retried)return;
    retried=true;
    var s=document.createElement('script');
    s.src='/nexa-shell.js?v=20260916-bootfix-'+Date.now();
    s.async=false;
    s.onerror=function(){showFailure('Nexa AI workspace could not start. Refresh once to retry.');};
    document.head.appendChild(s);
    setTimeout(function(){if(!mountReady())showFailure('Nexa AI workspace could not start. Please refresh once.');},2500);
  }
  setTimeout(function(){if(!mountReady())retryShell();},1800);
  setTimeout(function(){if(!mountReady())showFailure('Nexa AI workspace is taking longer than expected…');},900);
})();
</script>
</body>
</html>
