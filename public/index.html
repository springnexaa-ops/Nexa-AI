body{display:block;overflow:auto}
#nexa-loader{min-height:100vh;width:100%;display:grid;place-items:center;text-align:center;background:#f7f6f2}
#nexa-loader .box{width:min(420px,calc(100% - 40px));padding:32px 24px}
#nexa-loader img{width:46px;height:46px;border-radius:14px;margin-bottom:18px}
#nexa-loader b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:24px;letter-spacing:-.02em;color:#262421}
#nexa-loader span{display:block;margin-top:8px;color:#77736c;font-size:13px}
#nexa-loader i{display:block;width:18px;height:18px;border:2px solid #ddd8cf;border-top-color:#c76b38;border-radius:50%;animation:spin .7s linear infinite;margin:18px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-color-scheme:dark){
html,body{background:#1f1e1b;color:#eeeae3}
#nexa-loader{background:#1f1e1b}
#nexa-loader b{color:#f2eee7}
#nexa-loader span{color:#aaa49a}
#nexa-loader i{border-color:#4b4741;border-top-color:#d8844d}
